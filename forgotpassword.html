<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTech Foundation - Login/Signup page</title>
    <link rel="icon" type="image/png" href="Photos/logo New.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/forms.css">
</head>
<body>
    <!-- Background Container with Image -->
    <div class="background-container">
        <div class="gradient-overlay"></div>
          <img src="Images/img 3.png" alt="Gradient Overlay" class="gradient-image">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="main-header">
            <a href="index.html" class="logo">
                <img src="Photos/logo New.png" alt="PrimeTech Foundation Logo">
                <span class="logo-text">PrimeTech Foundation</span>
            </a>
        </header>
        </div>  
    <!-- Forgot Password Form -->
    <div class="form-container">
        <div class="form-brand" aria-hidden="false">
            <img src="Photos/logo New.png" alt="PrimeTech Foundation logo">
            <span class="logo-text">PrimeTech Foundation</span>
        </div>
        <h2>Forgot Password</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required inputmode="email" autocomplete="email" autofocus>
                <div class="error-message" id="forgotEmailError"></div>
            </div>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form> 
    </div>

    <!-- Forgot Success Modal -->
    <div id="forgotModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="forgotModalTitle">
        <div class="modal-header">
          <i class="fas fa-check-circle"></i>
          <h3 id="forgotModalTitle">Reset Link Sent</h3>
        </div>
        <p>We sent a password reset link to <strong id="forgotEmail"></strong>. Check your inbox and follow the instructions. You can also reset your password now:</p>
        <div class="modal-actions">
          <button class="btn btn-secondary close-modal" type="button">Close</button>
          <a href="updatepassword.html" class="btn btn-primary">Open Reset Page</a>
        </div>
      </div>
    </div>

    <script>
      (function(){
        const form = document.querySelector('.form-container form');
        const modal = document.getElementById('forgotModal');
        const emailEl = document.getElementById('forgotEmail');
        function validateEmail(email){
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        const emailError = document.getElementById('forgotEmailError');
        if (emailError) emailError.style.display = 'none';

        form.addEventListener('submit', function(e){
          e.preventDefault();
          const email = form.querySelector('input[type="email"]').value.trim();
          if (!validateEmail(email)) {
            if (emailError) { emailError.textContent = 'Please enter a valid email address'; emailError.style.display = 'block'; }
            return;
          }
          if (emailError) { emailError.textContent = ''; emailError.style.display = 'none'; }
          emailEl.textContent = email;
          modal.classList.add('show');
          modal.setAttribute('aria-hidden', 'false');
          // TODO: send request to backend to actually send reset link
        });
        document.querySelectorAll('.close-modal').forEach(btn=>{
          btn.addEventListener('click', ()=> {
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
          });
        });
        window.addEventListener('click', function(e){
          if (e.target === modal) modal.classList.remove('show');
        });
      })();
    </script>

</body>

</html>
