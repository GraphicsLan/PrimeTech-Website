<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PrimeTech Foundation</title>
    <meta name="description" content="Reset your PrimeTech Foundation account password">
    <link rel="icon" type="image/png" href="Photos/logo New.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/forms.css">
</head>
<body>
    <!-- Background Container -->
    <div class="background-container">
        <div class="gradient-overlay"></div>
        <img src="Images/img 3.png" alt="Background gradient" class="gradient-image">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Forgot Password Form -->
        <div class="form-container">
            <div class="form-brand">
                <img src="Photos/logo New.png" alt="PrimeTech Foundation logo">
                <span class="logo-text">PrimeTech Foundation</span>
            </div>
            
            <h2>Forgot Password</h2>
            
            <form id="forgotPasswordForm" method="POST" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           inputmode="email" autocomplete="email" 
                           placeholder="Enter your email address">
                    <div class="error-message" id="forgotEmailError"></div>
                </div>
                <button type="submit" class="btn-submit">Send Reset Link</button>
            </form>
        </div>

        <!-- Success Modal -->
        <div id="forgotModal" class="modal" aria-hidden="true" role="dialog" aria-modal="false">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fas fa-check-circle"></i>
                    <h3>Reset Link Sent</h3>
                </div>
                <p>We sent a password reset link to <strong id="forgotEmail"></strong>. 
                   Check your inbox and follow the instructions.</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary close-modal" type="button">Close</button>
                    <a href="updatepassword.html" class="btn btn-primary">Open Reset Page</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const form = document.getElementById('forgotPasswordForm');
            const modal = document.getElementById('forgotModal');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('forgotEmailError');
            const emailDisplay = document.getElementById('forgotEmail');
            
            // Email validation
            function validateEmail(email) {
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return regex.test(email);
            }
            
            // Show error
            function showError(element, message) {
                element.textContent = message;
                element.style.display = 'block';
                element.parentElement.classList.add('error');
            }
            
            // Clear error
            function clearError(element) {
                element.textContent = '';
                element.style.display = 'none';
                element.parentElement.classList.remove('error');
            }
            
            // Show modal
            function showModal(email) {
                emailDisplay.textContent = email;
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
                modal.setAttribute('aria-modal', 'true');
            }
            
            // Hide modal
            function hideModal() {
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');
                modal.setAttribute('aria-modal', 'false');
            }
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                clearError(emailError);
                
                // Validation
                if (!email) {
                    showError(emailError, 'Email address is required');
                    return;
                }
                
                if (!validateEmail(email)) {
                    showError(emailError, 'Please enter a valid email address');
                    return;
                }
                
                // Simulate API call
                const submitBtn = form.querySelector('.btn-submit');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Sending...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    // In production, this would be a real API call
                    console.log('Sending reset link to:', email);
                    
                    // Show success modal
                    showModal(email);
                    
                    // Reset button
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    // Reset form
                    form.reset();
                }, 1000);
            });
            
            // Modal controls
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', hideModal);
            });
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) hideModal();
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    hideModal();
                }
            });
            
            // Focus management for accessibility
            modal.addEventListener('transitionend', function() {
                if (modal.classList.contains('show')) {
                    modal.querySelector('.btn-secondary').focus();
                }
            });
            
        })();
    </script>
</body>
</html>
