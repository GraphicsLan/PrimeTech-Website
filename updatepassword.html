<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTech Foundation - Login/Signup page</title>
    <link rel="icon" type="image/png" href="Photos/logo New.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/forms.css">
</head>
<body>
    <!-- Background Container with Image -->
    <div class="background-container">
        <div class="gradient-overlay"></div>
          <img src="Images/img 3.png" alt="Gradient Overlay" class="gradient-image">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="main-header">
            <a href="index.html" class="logo">
                <img src="Photos/logo New.png" alt="PrimeTech Foundation Logo">
                <span class="logo-text">PrimeTech Foundation</span>
            </a>
        </header>
    </div>

    <!-- Update Password Form -->
    <div class="form-container">
        <div class="form-brand" aria-hidden="false">
            <img src="Photos/logo New.png" alt="PrimeTech Foundation logo">
            <span class="logo-text">PrimeTech Foundation</span>
        </div>
        <h2>Update Password</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password" required minlength="6" autocomplete="new-password" oninput="checkPasswordStrength('new-password', '.update-strength-fill', 'updateStrengthText')">
                <i class="fas fa-eye toggle-password" onclick="togglePassword('new-password', this)" role="button" tabindex="0" aria-label="Toggle password visibility"></i>
                <div class="password-strength" id="updatePasswordStrength" role="status" aria-live="polite" aria-atomic="true">
                    <div class="strength-bar">
                        <div class="strength-fill update-strength-fill"></div>
                    </div>
                    <span class="strength-text">Password strength: <span id="updateStrengthText">Weak</span></span>
                </div>
                <div class="error-message" id="newPasswordError"></div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6" autocomplete="new-password">
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form> 
    </div>

    <!-- Update Success Modal -->
    <div id="updateModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
        <div class="modal-header">
          <i class="fas fa-check-circle"></i>
          <h3 id="updateModalTitle">Password Updated</h3>
        </div>
        <p>Your password has been updated successfully. You can now sign in with your new password.</p>
        <div class="modal-actions">
          <button class="btn btn-secondary close-modal" type="button">Close</button>
          <a href="login.html" class="btn btn-primary">Sign In</a>
        </div>
      </div>
    </div>

    <script src="scripts/login.js"></script>
    <script>
      (function(){
        const form = document.querySelector('.form-container form');
        const modal = document.getElementById('updateModal');
        const newPwEl = document.getElementById('new-password');
        const confPwEl = document.getElementById('confirm-password');
        const newPwError = document.getElementById('newPasswordError');
        const confPwError = document.getElementById('confirmPasswordError');

        function clearErrors(){
          if (newPwError) { newPwError.textContent = ''; newPwError.style.display = 'none'; }
          if (confPwError) { confPwError.textContent = ''; confPwError.style.display = 'none'; }
        }

        form.addEventListener('submit', function(e){
          e.preventDefault();
          clearErrors();
          const p1 = newPwEl.value;
          const p2 = confPwEl.value;
          const strength = checkPasswordStrength('new-password', '.update-strength-fill', 'updateStrengthText');

          if (p1.length < 6) { newPwError.textContent = 'Password must be at least 6 characters'; newPwError.style.display = 'block'; return; }
          if (strength === 'Weak' || strength === 'Too short') { newPwError.textContent = 'Please choose a stronger password'; newPwError.style.display = 'block'; return; }
          if (p1 !== p2) { confPwError.textContent = 'Passwords do not match'; confPwError.style.display = 'block'; return; }

          modal.classList.add('show');
          modal.setAttribute('aria-hidden', 'false');
          // TODO: submit new password to backend and handle response
        });

        document.querySelectorAll('.close-modal').forEach(btn=>{
          btn.addEventListener('click', ()=> {
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
          });
        });
        window.addEventListener('click', function(e){
          if (e.target === modal) modal.classList.remove('show');
        });
      })();
    </script>
</body>
</html>
