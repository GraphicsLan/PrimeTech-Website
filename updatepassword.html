<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - PrimeTech Foundation</title>
    <meta name="description" content="Update your PrimeTech Foundation account password">
    <link rel="icon" type="image/png" href="Photos/logo New.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/forms.css">
</head>
<body>
    <!-- Background Container -->
    <div class="background-container">
        <div class="gradient-overlay"></div>
        <img src="Images/img 3.png" alt="Background gradient" class="gradient-image">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Update Password Form -->
        <div class="form-container">
            <div class="form-brand">
                <img src="Photos/logo New.png" alt="PrimeTech Foundation logo">
                <span class="logo-text">PrimeTech Foundation</span>
            </div>
            
            <h2>Update Password</h2>
            
            <form id="updatePasswordForm" method="POST" novalidate>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new-password" required 
                           minlength="6" autocomplete="new-password"
                           placeholder="Enter new password">
                    <button type="button" class="toggle-password" 
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text">
                            Password strength: <span id="strengthText">Weak</span>
                        </span>
                    </div>
                    <div class="error-message" id="newPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required 
                           minlength="6" autocomplete="new-password"
                           placeholder="Confirm new password">
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
                
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>

        <!-- Success Modal -->
        <div id="updateModal" class="modal" aria-hidden="true" role="dialog" aria-modal="false">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fas fa-check-circle"></i>
                    <h3>Password Updated</h3>
                </div>
                <p>Your password has been updated successfully. You can now sign in with your new password.</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary close-modal" type="button">Close</button>
                    <a href="login.html" class="btn btn-primary">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const form = document.getElementById('updatePasswordForm');
            const modal = document.getElementById('updateModal');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const newPasswordError = document.getElementById('newPasswordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            const togglePasswordBtns = document.querySelectorAll('.toggle-password');
            
            // Password strength checker
            function checkPasswordStrength(password) {
                let strength = 0;
                
                if (password.length < 6) {
                    return { strength: 0, text: 'Too short' };
                }
                
                // Length check
                if (password.length >= 8) strength++;
                if (password.length >= 12) strength++;
                
                // Complexity checks
                if (/[A-Z]/.test(password)) strength++; // Uppercase
                if (/[a-z]/.test(password)) strength++; // Lowercase
                if (/[0-9]/.test(password)) strength++; // Numbers
                if (/[^A-Za-z0-9]/.test(password)) strength++; // Special chars
                
                // Determine strength level
                let level, text, color;
                if (strength <= 2) {
                    level = 1;
                    text = 'Weak';
                    color = '#e74c3c';
                } else if (strength <= 4) {
                    level = 2;
                    text = 'Fair';
                    color = '#f39c12';
                } else {
                    level = 3;
                    text = 'Strong';
                    color = '#2ecc71';
                }
                
                return {
                    strength: level,
                    text: text,
                    color: color
                };
            }
            
            // Update password strength display
            function updatePasswordStrength() {
                const password = newPasswordInput.value;
                const strength = checkPasswordStrength(password);
                
                // Update visual indicators
                strengthFill.style.width = `${strength.strength * 33.33}%`;
                strengthFill.style.backgroundColor = strength.color;
                strengthText.textContent = strength.text;
                strengthText.style.color = strength.color;
            }
            
            // Toggle password visibility
            function togglePasswordVisibility(button) {
                const input = button.parentElement.querySelector('input[type="password"], input[type="text"]');
                const icon = button.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                    button.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                    button.setAttribute('aria-label', 'Show password');
                }
                
                input.focus();
            }
            
            // Show error
            function showError(element, message) {
                element.textContent = message;
                element.style.display = 'block';
                element.parentElement.classList.add('error');
            }
            
            // Clear errors
            function clearErrors() {
                [newPasswordError, confirmPasswordError].forEach(error => {
                    error.textContent = '';
                    error.style.display = 'none';
                    error.parentElement.classList.remove('error');
                });
            }
            
            // Show modal
            function showModal() {
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
                modal.setAttribute('aria-modal', 'true');
            }
            
            // Hide modal
            function hideModal() {
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');
                modal.setAttribute('aria-modal', 'false');
            }
            
            // Form validation
            function validateForm() {
                clearErrors();
                let isValid = true;
                
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();
                const strength = checkPasswordStrength(newPassword);
                
                // Check new password
                if (!newPassword) {
                    showError(newPasswordError, 'New password is required');
                    isValid = false;
                } else if (newPassword.length < 6) {
                    showError(newPasswordError, 'Password must be at least 6 characters');
                    isValid = false;
                } else if (strength.text === 'Weak') {
                    showError(newPasswordError, 'Please choose a stronger password');
                    isValid = false;
                }
                
                // Check confirmation
                if (!confirmPassword) {
                    showError(confirmPasswordError, 'Please confirm your password');
                    isValid = false;
                } else if (newPassword !== confirmPassword) {
                    showError(confirmPasswordError, 'Passwords do not match');
                    isValid = false;
                }
                
                return isValid;
            }
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!validateForm()) return;
                
                // Simulate API call
                const submitBtn = form.querySelector('.btn-submit');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Updating...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    // In production, this would be a real API call
                    console.log('Updating password...');
                    
                    // Show success modal
                    showModal();
                    
                    // Reset button
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    // Reset form
                    form.reset();
                    strengthFill.style.width = '0%';
                    strengthText.textContent = 'Weak';
                    strengthText.style.color = '';
                }, 1000);
            });
            
            // Event listeners
            newPasswordInput.addEventListener('input', updatePasswordStrength);
            
            togglePasswordBtns.forEach(btn => {
                btn.addEventListener('click', () => togglePasswordVisibility(btn));
                
                // Add keyboard support
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        togglePasswordVisibility(btn);
                    }
                });
            });
            
            // Modal controls
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', hideModal);
            });
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) hideModal();
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    hideModal();
                }
            });
            
            // Focus management for accessibility
            modal.addEventListener('transitionend', function() {
                if (modal.classList.contains('show')) {
                    modal.querySelector('.btn-secondary').focus();
                }
            });
            
        })();
    </script>
</body>
</html>
